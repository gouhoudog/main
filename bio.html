<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOUHOU_DOG BIOGRAPHY</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Kosugi&family=Zen+Maru+Gothic&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 構造を完全に独立させ、重ね順を制御しやすくします -->
    <!-- 背景の白 -->
    <div class="opening-white-screen" id="whiteScreen"></div>
    
    <!-- 中間の黄色ペンキ -->
    <div class="paint-curtain" id="paintCurtain"></div>
    
    <!-- 最前面のロゴ -->
    <img src="img/logo.png" alt="Logo" class="opening-logo" id="openingLogo">
    </div>

    <div class="paint-curtain" id="paintCurtain"></div>

<!-- （オープニング用の3つの要素（whiteScreen, paintCurtain, openingLogo）のすぐ下に配置します） -->
    <!-- 【新規追加】最上部の黄色い太い帯（ヘッダー） -->
    <header class="top-banner">
        <!-- ここにヘッダー用のアナザーロゴを配置します（例: header-logo.png） -->
        <img src="img/header-logo.png" alt="Header Logo" class="header-logo">
    </header>


<!-- メインコンテンツ -->
<div class="container">
        <img src="img/icon.png" alt="Profile Image" class="profile-img">
        
        <h1 class="name">ドッグさん</h1>
        <p class="name-sub">合法小狗</p>

        <!-- フレーズ -->
        <div class="profile-bio-container">
            <p class="job-title">デフォルメイラストレーター</p>
            
            
            <!-- リンクボタン -->
        <div class="links-wrapper-icon">
            <a href="https://x.com/gouhou_dog" class="icon-link-btn" target="_blank" rel="noopener noreferrer" title="X (Twitter)">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="https://weibo.com/u/7813664701" class="icon-link-btn" target="_blank" rel="noopener noreferrer" title="Weibo">
                <i class="fa-brands fa-weibo"></i>
            </a>
            <a href="mailto:xxx@gmail.com" class="icon-link-btn" rel="noopener noreferrer" title="Mail">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>

            <!-- 制作関係 -->


            <!-- 注意書き -->
            <div class="lang-message-box">
                <p class="lang-text">English OK, but I'm using the translation function.</p>
                <p class="lang-text">可以使用中文，不过会使用翻译功能。</p>
                <p class="lang-attention">
                    <i class="fa-solid fa-circle-exclamation"></i> 如果希望通过 QQ、WeChat 联系，也希望能先通过邮件联系我一次。
                </p>
            </div>

        </div>

<!-- 小見出し「GALLERY」 -->
        <h2 class="section-title">PICTURE</h2>

<!-- 【修正】サムネイル用と拡大表示用で、別の画像ファイルを指定できるようにします -->
        <div class="gallery-wrapper">
            
            <!-- 1枚目の画像設定 -->
            <!-- openModal('ここには拡大用の大きな画像ファイル名') -->
            <div class="thumb-card" onclick="openModal('pic/pic_001.png')">
                <!-- src="ここにはご自身で切り抜いたサムネイル用の画像ファイル名" -->
                <img src="pic/pic_001s.png" alt="Work 1" class="gallery-thumb">
            </div>
            
            <!-- 2枚目以降の画像設定 -->
            <div class="thumb-card" onclick="openModal('pic/pic_002.png')"><img src="pic/pic_002s.png" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('pic/pic_003.png')"><img src="pic/pic_003s.png" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('pic/pic_004.png')"><img src="pic/pic_004s.png" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('pic/pic_005.png')"><img src="pic/pic_005s.png" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('pic/pic_006.png')"><img src="pic/pic_006s.png" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('pic/pic_007.png')"><img src="pic/pic_007s.png" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('pic/pic_008.png')"><img src="pic/pic_008s.png" class="gallery-thumb"></div>
            <!-- 9枚目 -->
            <div class="thumb-card"> 
                <img src="img/ready.png" alt="More Works" class="gallery-thumb">
            </div>
            <!-- 9枚目のリンク(設定完了したら表示)
            <a href="gallery.html" class="thumb-card"> 
                <img src="img/ready.png" alt="More Works" class="gallery-thumb">
                
            </a>
            -->
        </div>

<!-- 小見出し「VIDEO」 -->
        <h2 class="section-title">VIDEO</h2>

<!-- 【修正】サムネイル用と拡大表示用で、別の画像ファイルを指定できるようにします -->
        <div class="gallery-wrapper">
            
            <!-- 1枚目の画像設定 -->
            <!-- openModal('ここには拡大用の大きな画像ファイル名') -->
            <div class="thumb-card" onclick="openModal('video/video-01.mp4')">
                <!-- src="ここにはご自身で切り抜いたサムネイル用の画像ファイル名" -->
                <img src="img/work1-s.png" alt="Work 1" class="gallery-thumb">
            </div>
            
            <!-- 2枚目以降の画像設定 -->
            <div class="thumb-card" onclick="openModal('video/video-02.mp4')"><img src="img/work1-s.png" alt="Video Work" class="gallery-thumb"></div>
            <div class="thumb-card" onclick="openModal('video/video-03.mp4')"><img src="img/work1-s.png" alt="Video Work" class="gallery-thumb"></div>
        </div>
        
    </div> <!-- containerの閉じタグ -->

<div class="modal-overlay" id="imageModal" onclick="closeModal()">
        <img src="" alt="Expanded Image" class="modal-content" id="modalImage">
        <video src="" class="modal-content" id="modalVideo" controls playsinline></video>
    </div>

    <script>
        /* ==========================================================================
           1. オープニング演出の制御
           ========================================================================== */
window.addEventListener('DOMContentLoaded', () => {
    const whiteScreen = document.getElementById('whiteScreen');
    const paintCurtain = document.getElementById('paintCurtain');
    const openingLogo = document.getElementById('openingLogo');
    
    // 【重要】一つ前のページのURL（足跡）を取得する
    const referrer = document.referrer;

    // もし前のページが「gallery.html」だったら（GALLERYから戻ってきた場合）
    if (referrer.includes('gallery.html')) {
        // アニメーションを一切流さず、一瞬で全てのカーテンとロゴを消し去る（即メイン画面を表示）
        whiteScreen.style.display = 'none';
        paintCurtain.style.display = 'none';
        openingLogo.style.display = 'none';
    } else {
        // 【通常時】これまで通りのロゴアニメーションを流す
        setTimeout(() => { paintCurtain.classList.add('slide-down'); }, 1200);
        setTimeout(() => { whiteScreen.classList.add('fade-out'); }, 2100);
        setTimeout(() => {
            paintCurtain.classList.remove('slide-down');
            paintCurtain.classList.add('slide-up');
        }, 2600);
        setTimeout(() => {
            paintCurtain.classList.add('hidden');
            openingLogo.classList.add('hidden');
        }, 3300);
    }
});


        

        /* ==========================================================================
           2. ギャラリー（画像・動画）の表示制御
           ========================================================================== */
        function openModal(fileSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            const modalVid = document.getElementById('modalVideo');

            // クリックされたファイル名が「.mp4」で終わるかチェック
            if (fileSrc.endsWith('.mp4')) {
                // 【動画の場合】
                modalImg.style.display = 'none';  /* 画像を隠す */
                modalVid.style.display = 'block'; /* 動画を表示 */
                modalVid.src = fileSrc;           /* 動画ファイルをセット */
                modalVid.play();                  /* 再生開始 */
            } else {
                // 【画像の場合】
                modalVid.style.display = 'none';  /* 動画を隠す */
                modalVid.pause();                 /* 動画を止める */
                modalImg.style.display = 'block'; /* 画像を表示 */
                modalImg.src = fileSrc;           /* 画像ファイルをセット */
            }

            modal.classList.add('active'); // モーダル全体を表示
        }

        // 閉じる関数
        function closeModal() {
            const modal = document.getElementById('imageModal');
            const modalVid = document.getElementById('modalVideo');
            
            modal.classList.remove('active');
            modalVid.pause();   /* 動画を止める */
            modalVid.src = "";  /* 動画データを空にする */
        }
    </script>
    </body>
</html>
