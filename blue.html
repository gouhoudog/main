<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links - Blue</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- bodyに「theme-blue」をつけることで水色を適用 -->
<body class="theme-blue">

    <div class="container">
        <img src="icon.png" alt="Profile Image" class="profile-img">
        <h1 class="name">あなたの名前 (青)</h1>
        <p class="bio">最も詳細な情報を掲載するページです。<br>すべての連絡先や主要なリンクを網羅しています。</p>

        <div class="links-wrapper">
            <a href="https://x.com/" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-x-twitter"></i> X (旧Twitter)
            </a>
            <a href="https://discord.gg/" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-discord"></i> Discord
            </a>
            <a href="https://your-portfolio.com" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-folder-open"></i> Portfolio
            </a>
            <!-- 追加のWebサイトリンク（地球のアイコン） -->
            <a href="https://your-website.com" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-globe"></i> Official Website
            </a>
        </div>
    </div>

</body>
</html>
