<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links - Red</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- bodyに「theme-red」をつけることで赤色を適用 -->
<body class="theme-red">

    <div class="container">
        <img src="icon.png" alt="Profile Image" class="profile-img">
        <h1 class="name">あなたの名前 (赤)</h1>
        <p class="bio">ここに少し詳しい来歴や活動内容を記入します。<br>活動実績（ポートフォリオ）を含めるページです。</p>

        <div class="links-wrapper">
            <a href="https://x.com/" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-x-twitter"></i> X (旧Twitter)
            </a>
            <a href="https://discord.gg/" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-discord"></i> Discord
            </a>
            <!-- ポートフォリオリンクを追加（フォルダのアイコン） -->
            <a href="https://your-portfolio.com" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-folder-open"></i> Portfolio
            </a>
        </div>
    </div>

</body>
</html>
